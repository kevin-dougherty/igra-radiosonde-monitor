name: IGRA Ingest

on:
  schedule:
    - cron: '30 1 * * *'   # 01:30 UTC — after 00Z launches
    - cron: '30 13 * * *'  # 13:30 UTC — after 12Z launches
  workflow_dispatch:        # allows manual trigger from GitHub UI

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install AWS CLI
        run: pip install awscli

      - name: Download existing database from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          mkdir -p data
          aws s3 cp s3://igra-database/igra.duckdb data/igra.duckdb \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }} || echo "No existing DB found, starting fresh"

      - name: Run ingest
        run: |
          python ingest.py \
            --stations-file conf/stations_us.txt \
            --start-year 2025 \
            --start-month 1 \
            --db data/igra.duckdb \
            --workers 4 \
            --mode launches \
            --all-hours

      - name: Load station metadata
        run: python load_metadata.py --db data/igra.duckdb

      - name: Verify database before publishing
        run: |
          python3 -c "
          import duckdb, sys

          MIN_ROWS = 50000  # well below normal (~80K+), well above 'empty'

          con = duckdb.connect('data/igra.duckdb', read_only=True)
          tables = con.execute('SHOW TABLES').fetchdf()['name'].tolist()

          if 'soundings' not in tables:
              print('FAIL: soundings table does not exist.')
              sys.exit(1)

          count = con.execute('SELECT COUNT(*) FROM soundings').fetchone()[0]
          print(f'soundings row count: {count:,}')
          if count < MIN_ROWS:
              print(f'FAIL: only {count:,} rows, expected at least {MIN_ROWS:,}.')
              sys.exit(1)

          if 'station_meta' not in tables:
              print('FAIL: station_meta table does not exist.')
              sys.exit(1)

          meta_count = con.execute('SELECT COUNT(*) FROM station_meta').fetchone()[0]
          print(f'station_meta row count: {meta_count:,}')
          if meta_count < 50:
              print(f'FAIL: only {meta_count:,} stations in station_meta, expected 90+.')
              sys.exit(1)

          print('OK: database looks healthy, safe to publish.')
          "

      - name: Upload updated database to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp data/igra.duckdb s3://igra-database/igra.duckdb \
            --endpoint-url ${{ secrets.R2_ENDPOINT_URL }}
          echo "Upload complete"
